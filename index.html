  <!-- 메인 React 애플리케이션 -->

        chevronLeft: (

        ),

            <circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>

            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
          </svg>
        ),
        upload: (
          <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>

      return icons[name] || null;
    };

    // ==========================================
    // 1. Firebase 설정 및 상수 정의
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyCiZwQRHV4JNJ8eKPD_7vywvFixpkp05Ew",
      authDomain: "gen-lang-client-0971193971.firebaseapp.com",
      projectId: "gen-lang-client-0971193971",
      storageBucket: "gen-lang-client-0971193971.firebasestorage.app",
      messagingSenderId: "241337759982",
      appId: "1:241337759982:web:b89ef9c6cf9d6b7b0bdbff",
      measurementId: "G-Q19NHPNY2K"
    };
    const appId = 'homework-project-app';

    const DEFAULT_TEACHER_LOGO = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAMAAACahl6sAAAAA1BMVEW3t7cAAADjA3R3AAAASElEQVR4nO3BMQEAAADCoPVPbQ0PoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIC3AcX9AAG2h4WTAAAAAElFTkSuQmCC";

    const DAYS_OF_WEEK = [
      { id: 1, label: '월', full: '월요일' },
      { id: 2, label: '화', full: '화요일' },
      { id: 3, label: '수', full: '수요일' },
      { id: 4, label: '목', full: '목요일' },
      { id: 5, label: '금', full: '금요일' },
      { id: 6, label: '토', full: '토요일' },
      { id: 0, label: '일', full: '일요일' },
    ];

    const SAMPLE_STUDENTS = [
      { id: 'STU101', name: '김민준', className: '1반' },
      { id: 'STU102', name: '이서연', className: '1반' },
      { id: 'STU103', name: '박도윤', className: '1반' },
      { id: 'STU104', name: '최지우', className: '2반' },
    ];

    const SAMPLE_HOMEWORKS = [
      { id: 'HW1', title: '수학 익힘책 45쪽 풀기', type: 'weekly', days: [1, 2, 3, 4, 5], className: '1반' },
      { id: 'HW2', title: '독서 30분 후 독서록 쓰기', type: 'weekly', days: [1, 3, 5], className: '2반' },
    ];

    const formatDate = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const isHomeworkActiveOnDate = (hw, dateObj) => {
      const dateStr = formatDate(dateObj);
      if (hw.type === 'specific' || hw.specificDate) {
        return hw.specificDate === dateStr;
      }
      return Array.isArray(hw.days) && hw.days.includes(dateObj.getDay());
    };

    const getWeekDates = (baseDate) => {
      const d = new Date(baseDate);
      const day = d.getDay();
      const diffToMonday = day === 0 ? -6 : 1 - day;
      const monday = new Date(d);
      monday.setDate(d.getDate() + diffToMonday);

      const week = [];
      for (let i = 0; i < 7; i++) {
        const cur = new Date(monday);
        cur.setDate(monday.getDate() + i);
        week.push(cur);
      }
      return week;
    };

    const getMonthDates = (baseDate) => {
      const y = baseDate.getFullYear();
      const m = baseDate.getMonth();
      const lastDay = new Date(y, m + 1, 0).getDate();
      const month = [];
      for (let i = 1; i <= lastDay; i++) {
        month.push(new Date(y, m, i));
      }
      return month;
    };

    function App({ fb }) {
      const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } = fb;

      const { auth, db } = useMemo(() => {
        const app = initializeApp(firebaseConfig);
        return {
          auth: getAuth(app),
          db: getFirestore(app)
        };
      }, []);

      const [firebaseUser, setFirebaseUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      const [userRole, setUserRole] = useState(null);
      const [currentStudent, setCurrentStudent] = useState(null);

      const [loginTab, setLoginTab] = useState('student');
      const [studentNameInput, setStudentNameInput] = useState('');
      const [teacherPinInput, setTeacherPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [students, setStudents] = useState([]);
      const [homeworks, setHomeworks] = useState([]);
      const [submissions, setSubmissions] = useState([]);
      const [customClasses, setCustomClasses] = useState([]);
      const [homeLogoUrl, setHomeLogoUrl] = useState(DEFAULT_TEACHER_LOGO);
      const [dataLoading, setDataLoading] = useState(true);

      const [activeTab, setActiveTab] = useState('check');
      const [viewPeriod, setViewPeriod] = useState('day');
      const [selectedDate, setSelectedDate] = useState(() => new Date());
      const [classFilter, setClassFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      const [toastMsg, setToastMsg] = useState(null);
      const [confirmModal, setConfirmModal] = useState(null);

      const [newStudentName, setNewStudentName] = useState('');
      const [newStudentId, setNewStudentId] = useState('');
      const [newStudentClass, setNewStudentClass] = useState('1반');

      const [newClassNameInput, setNewClassNameInput] = useState('');
      const [classToDelete, setClassToDelete] = useState(null);
      const [classDeletePinInput, setClassDeletePinInput] = useState('');
      const [draggedStudentId, setDraggedStudentId] = useState(null);
      const [manageStudentClassFilter, setManageStudentClassFilter] = useState('ALL');

      const [newHwTitle, setNewHwTitle] = useState('');
      const [newHwType, setNewHwType] = useState('weekly');
      const [newHwDays, setNewHwDays] = useState([1, 2, 3, 4, 5]);
      const [newHwSpecificDate, setNewHwSpecificDate] = useState(() => formatDate(new Date()));
      const [newHwClass, setNewHwClass] = useState('1반');

      const [currentAdminPin, setCurrentAdminPin] = useState('1234');
      const [oldPinInput, setOldPinInput] = useState('');
      const [newPinInput, setNewPinInput] = useState('');
      const [confirmPinInput, setConfirmPinInput] = useState('');

      const showToast = (message, type = 'success') => {
        setToastMsg({ message, type });
        setTimeout(() => setToastMsg(null), 3000);
      };

      useEffect(() => {
        const initAuth = async () => {
          try {
            await signInAnonymously(auth);
          } catch (err) {
            console.error('Firebase Auth Error:', err);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (user) => {
          setFirebaseUser(user);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, [auth]);

      useEffect(() => {
        if (!firebaseUser) return;

        const studentsRef = collection(db, 'artifacts', appId, 'public', 'data', 'students');
        const homeworksRef = collection(db, 'artifacts', appId, 'public', 'data', 'homeworks');
        const submissionsRef = collection(db, 'artifacts', appId, 'public', 'data', 'submissions');
        const classesRef = collection(db, 'artifacts', appId, 'public', 'data', 'classes');
        const settingsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'branding');

        const unsubStudents = onSnapshot(
          studentsRef,
          (snapshot) => {
            setStudents(snapshot.docs.map((d) => ({ id: d.id, ...d.data() })));
            setDataLoading(false);
          },
          (error) => {
            console.error('Students fetch error:', error);
            setDataLoading(false);
          }
        );

        const unsubHomeworks = onSnapshot(
          homeworksRef,
          (snapshot) => {
            setHomeworks(snapshot.docs.map((d) => ({ id: d.id, ...d.data() })));
          },
          (error) => console.error('Homeworks fetch error:', error)
        );

        const unsubSubmissions = onSnapshot(
          submissionsRef,
          (snapshot) => {
            setSubmissions(snapshot.docs.map((d) => ({ id: d.id, ...d.data() })));
          },
          (error) => console.error('Submissions fetch error:', error)
        );

        const unsubClasses = onSnapshot(
          classesRef,
          (snapshot) => {
            setCustomClasses(snapshot.docs.map((d) => d.data().name).filter(Boolean));
          },
          (error) => console.error('Classes fetch error:', error)
        );

        const unsubSettings = onSnapshot(
          settingsDocRef,
          (docSnap) => {
            if (docSnap.exists()) {
              const data = docSnap.data();
              const rawUrl = data.logoDataUrl || data.url || data.image || '';
              if (rawUrl && typeof rawUrl === 'string' && rawUrl.length > 50) {
                let cleaned = rawUrl.trim().replace(/^["']+|["']+$/g, '').replace(/[\r\n\s]+/g, '');
                if (cleaned.includes('base64,')) {
                  const pureBase64 = cleaned.split('base64,').pop();
                  cleaned = `data:image/png;base64,${pureBase64}`;
                } else if (!cleaned.startsWith('http')) {
                  cleaned = `data:image/png;base64,${cleaned}`;
                }
                setHomeLogoUrl(cleaned);
              } else {
                setHomeLogoUrl(DEFAULT_TEACHER_LOGO);
              }
            } else {
              setHomeLogoUrl(DEFAULT_TEACHER_LOGO);
            }
          },
          (error) => {
            console.error('Branding fetch error:', error);
            setHomeLogoUrl(DEFAULT_TEACHER_LOGO);
          }
        );

        return () => {
          unsubStudents();
          unsubHomeworks();
          unsubSubmissions();
          unsubClasses();
          unsubSettings();
        };
      }, [firebaseUser, db]);

      const formattedSelectedDate = useMemo(() => formatDate(selectedDate), [selectedDate]);
      const selectedDayOfWeek = useMemo(() => selectedDate.getDay(), [selectedDate]);

      const activeHomeworksForDate = useMemo(() => {
        return homeworks.filter((hw) => isHomeworkActiveOnDate(hw, selectedDate));
      }, [homeworks, selectedDate]);

      const submissionMap = useMemo(() => {
        const map = {};
        submissions.forEach((sub) => {
          map[sub.id] = sub.completed;
        });
        return map;
      }, [submissions]);

      const studentPointsMap = useMemo(() => {
        const map = {};
        students.forEach((st) => {
          map[st.id] = 0;
        });
        submissions.forEach((sub) => {
          if (sub.completed && sub.studentId) {
            map[sub.studentId] = (map[sub.studentId] || 0) + 1;
          }
        });
        return map;
      }, [students, submissions]);

      const handleToggleSubmission = async (studentId, homeworkId, targetDateStr = formattedSelectedDate) => {
        if (!firebaseUser) return;
        const subId = `${targetDateStr}_${studentId}_${homeworkId}`;
        const currentStatus = !!submissionMap[subId];
        const nextStatus = !currentStatus;

        try {
          const subDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'submissions', subId);
          await setDoc(subDocRef, {
            date: targetDateStr,
            studentId,
            homeworkId,
            completed: nextStatus,
            points: nextStatus ? 1 : 0,
            updatedAt: serverTimestamp(),
          });
          if (userRole === 'student') {
            showToast(nextStatus ? '숙제 완료! +1 포인트를 획득했어요 🎉' : '완료가 취소되었습니다.');
          }
        } catch (err) {
          showToast('저장 중 오류가 발생했습니다.', 'error');
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');

        if (loginTab === 'teacher') {
          if (teacherPinInput === currentAdminPin) {
            setUserRole('teacher');
            setActiveTab('check');
            showToast('교사 관리자 모드로 로그인했습니다.');
          } else {
            setLoginError('비밀번호가 올바르지 않습니다.');
          }
        } else {
          const cleanId = studentNameInput.trim().toLowerCase();
          if (!cleanId) {
            setLoginError('학생 아이디를 입력해 주세요.');
            return;
          }
          const found = students.find((s) => (s.id || '').toLowerCase() === cleanId);
          if (found) {
            setCurrentStudent(found);
            setUserRole('student');
            showToast(`${found.name} 학생, 환영합니다!`);
          } else {
            setLoginError('등록되지 않은 학생 아이디입니다.');
          }
        }
      };

      const handleLogout = () => {
        setUserRole(null);
        setCurrentStudent(null);
        setStudentNameInput('');
        setTeacherPinInput('');
        setLoginError('');
      };

      const handleLoadSampleData = async () => {
        if (!firebaseUser) return;
        try {
          for (const st of SAMPLE_STUDENTS) {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', st.id), st);
          }
          for (const hw of SAMPLE_HOMEWORKS) {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'homeworks', hw.id), hw);
          }
          showToast('샘플 학생 명단과 숙제가 등록되었습니다!');
        } catch (err) {
          showToast('샘플 데이터 등록에 실패했습니다.', 'error');
        }
      };

      const handleAddStudent = async (e) => {
        e.preventDefault();
        const cleanId = newStudentId.trim().toUpperCase() || `STU_${Date.now()}`;
        const cleanName = newStudentName.trim();
        const cleanClass = newStudentClass.trim() || '1반';

        if (!cleanName) {
          showToast('학생 이름을 입력해 주세요.', 'error');
          return;
        }

        try {
          const nextOrder = students.length > 0 ? Math.max(...students.map((s) => s.order ?? 0)) + 1 : 0;
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', cleanId), {
            id: cleanId,
            name: cleanName,
            className: cleanClass,
            order: nextOrder,
            createdAt: serverTimestamp(),
          });
          setNewStudentName('');
          setNewStudentId('');
          showToast(`${cleanName} 학생이 등록되었습니다.`);
        } catch (err) {
          showToast('학생 등록 중 오류가 발생했습니다.', 'error');
        }
      };

      const handleDeleteStudent = (student) => {
        setConfirmModal({
          title: '학생 삭제 확인',
          message: `${student.name} 학생을 명단에서 삭제하시겠습니까?`,
          onConfirm: async () => {
            try {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', student.id));
              showToast('학생이 삭제되었습니다.');
            } catch (err) {
              showToast('삭제 중 오류가 발생했습니다.', 'error');
            }
            setConfirmModal(null);
          },
        });
      };

      const handleAddClass = async (e) => {
        e.preventDefault();
        const cleanName = newClassNameInput.trim();
        if (!cleanName) {
          showToast('반 이름을 입력해 주세요.', 'error');
          return;
        }
        const existingSet = new Set([...customClasses, ...students.map((s) => s.className || '1반')]);
        if (existingSet.has(cleanName)) {
          showToast('이미 존재하는 반 이름입니다.', 'error');
          return;
        }

        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', cleanName), {
            name: cleanName,
            createdAt: serverTimestamp(),
          });
          setNewStudentClass(cleanName);
          setNewClassNameInput('');
          showToast(`새로운 '${cleanName}'이(가) 추가되었습니다!`);
        } catch (err) {
          showToast('반 추가 중 오류가 발생했습니다.', 'error');
        }
      };

      const confirmDeleteClass = (className) => {
        setClassToDelete(className);
        setClassDeletePinInput('');
      };

      const executeDeleteClass = async () => {
        if (classDeletePinInput !== currentAdminPin) {
          showToast('관리자 비밀번호가 올바르지 않습니다.', 'error');
          return;
        }

        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', classToDelete));
          const targetStudents = students.filter((s) => (s.className || '1반') === classToDelete);
          for (const st of targetStudents) {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', st.id), {
              ...st,
              className: '1반',
            });
          }
          showToast(`'${classToDelete}'이(가) 삭제되었습니다.`);
          setClassToDelete(null);
          setClassDeletePinInput('');
        } catch (err) {
          showToast('반 삭제 중 오류가 발생했습니다.', 'error');
        }
      };

      const handleChangeStudentClass = async (student, nextClass) => {
        if (!nextClass || (student.className || '1반') === nextClass) return;
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', student.id), {
            ...student,
            className: nextClass,
          });
          showToast(`${student.name} 학생이 '${nextClass}'(으)로 이동되었습니다.`);
        } catch (err) {
          showToast('반 이동 중 오류가 발생했습니다.', 'error');
        }
      };

      const sortedStudents = useMemo(() => {
        return [...students].sort((a, b) => {
          const orderA = typeof a.order === 'number' ? a.order : 999999;
          const orderB = typeof b.order === 'number' ? b.order : 999999;
          if (orderA !== orderB) return orderA - orderB;
          return a.name.localeCompare(b.name, 'ko');
        });
      }, [students]);

      const handleDropStudent = async (targetStudentId) => {
        if (!draggedStudentId || draggedStudentId === targetStudentId) {
          setDraggedStudentId(null);
          return;
        }

        const currentList = [...sortedStudents];
        const fromIdx = currentList.findIndex((s) => s.id === draggedStudentId);
        const toIdx = currentList.findIndex((s) => s.id === targetStudentId);

        if (fromIdx === -1 || toIdx === -1) {
          setDraggedStudentId(null);
          return;
        }

        const [moved] = currentList.splice(fromIdx, 1);
        currentList.splice(toIdx, 0, moved);
        setDraggedStudentId(null);

        try {
          await Promise.all(
            currentList.map((st, idx) =>
              setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', st.id), {
                ...st,
                order: idx,
              })
            )
          );
          showToast('학생 순서가 변경되었습니다.');
        } catch (err) {
          showToast('순서 저장 중 오류가 발생했습니다.', 'error');
        }
      };

      const handleAddHomework = async (e) => {
        e.preventDefault();
        const cleanTitle = newHwTitle.trim();
        if (!cleanTitle) {
          showToast('숙제 내용을 입력해 주세요.', 'error');
          return;
        }

        const hwId = `HW_${Date.now()}`;
        const payload = {
          id: hwId,
          title: cleanTitle,
          type: newHwType,
          days: newHwType === 'weekly' ? newHwDays : [],
          specificDate: newHwType === 'specific' ? newHwSpecificDate : null,
          className: newHwClass,
          createdAt: serverTimestamp(),
        };

        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'homeworks', hwId), payload);
          setNewHwTitle('');
          showToast('새 숙제가 등록되었습니다.');
        } catch (err) {
          showToast('숙제 등록 중 오류가 발생했습니다.', 'error');
        }
      };

      const handleDeleteHomework = (hw) => {
        setConfirmModal({
          title: '숙제 삭제 확인',
          message: `'${hw.title}' 숙제를 삭제하시겠습니까?`,
          onConfirm: async () => {
            try {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'homeworks', hw.id));
              showToast('숙제가 삭제되었습니다.');
            } catch (err) {
              showToast('삭제 중 오류가 발생했습니다.', 'error');
            }
            setConfirmModal(null);
          },
        });
      };

      const handleUploadHomeImage = (e) => {
        const file = e.target.files?.[0];
        if (!file || !firebaseUser) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new window.Image();
          img.onload = async () => {
            const canvas = document.createElement('canvas');
            const maxSize = 400;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxSize) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              }
            } else {
              if (height > maxSize) {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const compressedDataUrl = canvas.toDataURL('image/png', 0.9);

            try {
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'branding'), {
                logoDataUrl: compressedDataUrl,
                updatedAt: serverTimestamp(),
              });
              showToast('마스코트 이미지가 성공적으로 등록되었습니다!');
            } catch (err) {
              showToast('이미지 저장 중 오류가 발생했습니다.', 'error');
            }
          };
          img.src = event.target?.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

      const handleResetHomeImage = async () => {
        if (!firebaseUser) return;
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'branding'));
          showToast('기본 마스코트로 복원되었습니다.');
        } catch (err) {
          showToast('복원 중 오류가 발생했습니다.', 'error');
        }
      };

      const handleChangeAdminPin = (e) => {
        e.preventDefault();
        if (oldPinInput !== currentAdminPin) {
          showToast('현재 비밀번호가 일치하지 않습니다.', 'error');
          return;
        }
        if (newPinInput.length !== 4 || isNaN(newPinInput)) {
          showToast('새 비밀번호는 4자리 숫자로 입력해 주세요.', 'error');
          return;
        }
        if (newPinInput !== confirmPinInput) {
          showToast('새 비밀번호와 확인 번호가 일치하지 않습니다.', 'error');
          return;
        }

        setCurrentAdminPin(newPinInput);
        setOldPinInput('');
        setNewPinInput('');
        setConfirmPinInput('');
        showToast('관리자 비밀번호가 성공적으로 변경되었습니다! 🔑');
      };

      const changeDate = (offset) => {
        const next = new Date(selectedDate);
        if (viewPeriod === 'week') {
          next.setDate(next.getDate() + offset * 7);
        } else if (viewPeriod === 'month') {
          next.setMonth(next.getMonth() + offset);
        } else {
          next.setDate(next.getDate() + offset);
        }
        setSelectedDate(next);
      };

      const periodInfo = useMemo(() => {
        const weekDates = getWeekDates(selectedDate);
        const monthDates = getMonthDates(selectedDate);

        if (viewPeriod === 'week') {
          return {
            dates: weekDates,
            label: `${formatDate(weekDates[0])} ~ ${formatDate(weekDates[6])}`,
            subBadge: '주간 보기',
          };
        }
        if (viewPeriod === 'month') {
          return {
            dates: monthDates,
            label: `${selectedDate.getFullYear()}년 ${selectedDate.getMonth() + 1}월`,
            subBadge: '월간 보기',
          };
        }
        return {
          dates: [selectedDate],
          label: formattedSelectedDate,
          subBadge: DAYS_OF_WEEK.find((d) => d.id === selectedDayOfWeek)?.full || '',
        };
      }, [selectedDate, viewPeriod, formattedSelectedDate, selectedDayOfWeek]);

      const availableClasses = useMemo(() => {
        const set = new Set([...customClasses, ...students.map((s) => s.className || '1반')]);
        if (set.size === 0) set.add('1반');
        return ['ALL', ...Array.from(set).sort()];
      }, [customClasses, students]);

      const filteredStudents = useMemo(() => {
        return sortedStudents
          .filter((s) => (classFilter === 'ALL' ? true : (s.className || '1반') === classFilter))
          .filter(
            (s) =>
              s.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
              s.id.toLowerCase().includes(searchQuery.toLowerCase())
          );
      }, [sortedStudents, classFilter, searchQuery]);

      const dashboardStats = useMemo(() => {
        const targetDates = periodInfo.dates;

        let totalExpected = 0;
        let totalCompleted = 0;

        targetDates.forEach((d) => {
          const dStr = formatDate(d);
          const dayHws = homeworks.filter((hw) => isHomeworkActiveOnDate(hw, d));

          filteredStudents.forEach((st) => {
            const studentClass = st.className || '1반';
            const studentHws = dayHws.filter(
              (hw) => !hw.className || hw.className === '전체' || hw.className === studentClass
            );
            totalExpected += studentHws.length;

            studentHws.forEach((hw) => {
              if (submissionMap[`${dStr}_${st.id}_${hw.id}`]) {
                totalCompleted++;
              }
            });
          });
        });

        const overallRate = totalExpected > 0 ? Math.round((totalCompleted / totalExpected) * 100) : 0;
        return { overallRate };
      }, [filteredStudents, periodInfo, submissionMap, homeworks]);

      if (authLoading || dataLoading) {
        return (
          <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
            <div className="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-slate-600 font-medium">숙제 데이터를 불러오는 중...</p>
          </div>
        );
      }

      if (!userRole) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-blue-50 flex items-center justify-center p-4">
            {toastMsg && (
              <div className={`fixed top-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-white font-medium ${toastMsg.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
                {toastMsg.message}
              </div>
            )}

            <div className="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
              <div className="bg-indigo-600 p-8 text-white text-center relative">
                <div className="w-28 h-28 rounded-full bg-white p-1 shadow-lg mx-auto mb-4 overflow-hidden relative flex items-center justify-center">
                  <img
                    key={homeLogoUrl ? homeLogoUrl.slice(-16) : 'default'}
                    src={homeLogoUrl || DEFAULT_TEACHER_LOGO}
                    alt="마스코트"
                    className="w-full h-full object-cover rounded-full"
                    onError={(e) => {
                      e.currentTarget.src = DEFAULT_TEACHER_LOGO;
                    }}
                  />
                </div>
                <h1 className="text-2xl font-bold tracking-tight">아 했냐고! 시스템</h1>
                <p className="text-indigo-100 text-sm mt-1">학생과 선생님이 함께 쓰는 실시간 숙제 관리</p>
              </div>

              <div className="grid grid-cols-2 border-b border-slate-100 bg-slate-50/50">
                <button
                  type="button"
                  onClick={() => { setLoginTab('student'); setLoginError(''); }}
                  className={`py-4 text-sm font-semibold flex items-center justify-center gap-2 border-b-2 ${loginTab === 'student' ? 'border-indigo-600 text-indigo-600 bg-white' : 'border-transparent text-slate-500'}`}
                >
                  <Icon name="userCheck" className="w-4 h-4" /> 학생 로그인
                </button>
                <button
                  type="button"
                  onClick={() => { setLoginTab('teacher'); setLoginError(''); }}
                  className={`py-4 text-sm font-semibold flex items-center justify-center gap-2 border-b-2 ${loginTab === 'teacher' ? 'border-indigo-600 text-indigo-600 bg-white' : 'border-transparent text-slate-500'}`}
                >
                  <Icon name="shield" className="w-4 h-4" /> 교사 관리자
                </button>
              </div>

              <form onSubmit={handleLogin} className="p-8 space-y-5">
                {loginTab === 'student' ? (
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-2">학생 아이디</label>
                    <input
                      type="text"
                      value={studentNameInput}
                      onChange={(e) => setStudentNameInput(e.target.value)}
                      placeholder="예: yces3101"
                      className="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
                    />
                  </div>
                ) : (
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-2">관리자 비밀번호</label>
                    <input
                      type="password"
                      value={teacherPinInput}
                      onChange={(e) => setTeacherPinInput(e.target.value)}
                      placeholder="기본 비밀번호: 1234"
                      className="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                )}

                {loginError && (
                  <div className="p-3.5 rounded-xl bg-rose-50 border border-rose-100 text-rose-600 text-sm flex items-center gap-2">
                    <Icon name="alert" className="w-4 h-4 shrink-0" />
                    <span>{loginError}</span>
                  </div>
                )}

                <button
                  type="submit"
                  className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition-all"
                >
                  {loginTab === 'student' ? '내 숙제 체크하러 가기' : '관리자 대시보드 열기'}
                </button>

                {students.length === 0 && (
                  <div className="pt-4 border-t border-slate-100 text-center">
                    <button
                      type="button"
                      onClick={handleLoadSampleData}
                      className="text-xs font-semibold text-indigo-600 hover:underline bg-indigo-50 px-3 py-2 rounded-lg"
                    >
                      + 테스트용 샘플 학생/숙제 바로 채우기
                    </button>
                  </div>
                )}
              </form>
            </div>
          </div>
        );
      }

      if (userRole === 'student' && currentStudent) {
        const studentClassHomeworks = activeHomeworksForDate.filter(
          (hw) => !hw.className || hw.className === '전체' || hw.className === currentStudent.className
        );
        const myDoneCount = studentClassHomeworks.filter(
          (hw) => submissionMap[`${formattedSelectedDate}_${currentStudent.id}_${hw.id}`]
        ).length;
        const myTotalCount = studentClassHomeworks.length;
        const myRate = myTotalCount > 0 ? Math.round((myDoneCount / myTotalCount) * 100) : 0;
        const myTotalPoints = studentPointsMap[currentStudent.id] || 0;

        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 pb-12">
            {toastMsg && (
              <div className="fixed top-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg bg-emerald-600 text-white font-medium">
                {toastMsg.message}
              </div>
            )}

            <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
              <div className="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold">
                    {currentStudent.name[0]}
                  </div>
                  <div>
                    <span className="font-bold text-slate-900">{currentStudent.name}</span>
                    <span className="ml-2 text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 font-semibold">
                      {currentStudent.className}
                    </span>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-700 font-extrabold text-sm">
                    <Icon name="coins" className="w-4 h-4 text-amber-500" />
                    <span>{myTotalPoints} P</span>
                  </div>
                  <button
                    onClick={handleLogout}
                    className="flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-rose-600 px-3 py-2 rounded-lg"
                  >
                    <Icon name="logOut" className="w-4 h-4" /> 로그아웃
                  </button>
                </div>
              </div>
            </header>

            <main className="max-w-3xl mx-auto px-4 pt-6 space-y-6">
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <button onClick={() => changeDate(-1)} className="p-2.5 rounded-xl hover:bg-slate-100 text-slate-600">
                  <Icon name="chevronLeft" className="w-5 h-5" />
                </button>
                <div className="text-center">
                  <div className="flex items-center justify-center gap-2">
                    <Icon name="calendar" className="w-4 h-4 text-indigo-600" />
                    <span className="font-bold text-lg text-slate-900">{formattedSelectedDate}</span>
                    <span className="px-2 py-0.5 text-xs font-bold rounded-md bg-indigo-100 text-indigo-700">
                      {DAYS_OF_WEEK.find((d) => d.id === selectedDayOfWeek)?.full}
                    </span>
                  </div>
                </div>
                <button onClick={() => changeDate(1)} className="p-2.5 rounded-xl hover:bg-slate-100 text-slate-600">
                  <Icon name="chevronRight" className="w-5 h-5" />
                </button>
              </div>

              <div className="bg-gradient-to-r from-indigo-600 to-blue-600 rounded-3xl p-6 text-white shadow-lg">
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <p className="text-indigo-100 text-sm font-medium">오늘의 숙제 달성 현황</p>
                    <h2 className="text-2xl font-bold mt-1">
                      {myTotalCount === 0 ? '오늘은 예정된 숙제가 없어요!' : `${myTotalCount}개 중 ${myDoneCount}개 완료!`}
                    </h2>
                  </div>
                  <div className="w-14 h-14 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center text-xl font-extrabold">
                    {myRate}%
                  </div>
                </div>
                <div className="w-full h-3 bg-black/20 rounded-full overflow-hidden">
                  <div className="h-full bg-white rounded-full transition-all" style={{ width: `${myRate}%` }} />
                </div>
              </div>

              <div className="space-y-3">
                <h3 className="text-base font-bold text-slate-800">오늘 해야 할 숙제 ({myTotalCount}개)</h3>
                {studentClassHomeworks.map((hw) => {
                  const isDone = !!submissionMap[`${formattedSelectedDate}_${currentStudent.id}_${hw.id}`];
                  return (
                    <button
                      key={hw.id}
                      onClick={() => handleToggleSubmission(currentStudent.id, hw.id)}
                      className={`w-full text-left p-5 rounded-2xl border transition-all flex items-center justify-between ${
                        isDone ? 'bg-emerald-50 border-emerald-200' : 'bg-white border-slate-200 hover:border-indigo-300'
                      }`}
                    >
                      <div className="flex items-center gap-4">
                        {isDone ? <Icon name="checkCircle" className="w-8 h-8 text-emerald-600" /> : <Icon name="circle" className="w-8 h-8 text-slate-300" />}
                        <div>
                          <h4 className={`text-lg font-bold ${isDone ? 'text-emerald-900 line-through' : 'text-slate-900'}`}>{hw.title}</h4>
                        </div>
                      </div>
                      <span className={`px-3.5 py-1.5 rounded-xl text-sm font-bold ${isDone ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                        {isDone ? '완료 (+1P)' : '미완료'}
                      </span>
                    </button>
                  );
                })}
              </div>
            </main>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 pb-16">
          {toastMsg && (
            <div className={`fixed top-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-white font-medium ${toastMsg.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
              {toastMsg.message}
            </div>
          )}

          {confirmModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-900">{confirmModal.title}</h3>
                <p className="text-sm text-slate-600">{confirmModal.message}</p>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setConfirmModal(null)} className="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600">취소</button>
                  <button onClick={confirmModal.onConfirm} className="px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 text-white">삭제</button>
                </div>
              </div>
            </div>
          )}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center">
                  <Icon name="shield" className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="font-bold text-slate-900 text-base sm:text-lg">아 했냐고! 시스템</h1>
                  <span className="text-xs text-indigo-600 font-semibold">교사 관리자 모드</span>
                </div>
              </div>
              <button onClick={handleLogout} className="flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-rose-600 px-3 py-2 rounded-lg">
                <Icon name="logOut" className="w-4 h-4" /> 로그아웃
              </button>

                          onChange={(e) => setClassDeletePinInput(e.target.value)}
                          placeholder="관리자 4자리 PIN"
                          className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                        <div className="flex justify-end gap-2">
                          <button
                            type="button"
                            onClick={() => { setClassToDelete(null); setClassDeletePinInput(''); }}
                            className="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600"
                          >
                            취소
                          </button>
                          <button
                            type="button"
                            onClick={executeDeleteClass}
                            className="px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 text-white"
                          >
                            확인 및 삭제
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </section>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <section className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-5">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2.5">
                        <div className="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
                          <Icon name="users" className="w-5 h-5" />
                        </div>
                        <div>
                          <h3 className="text-lg font-bold text-slate-900">학생 명단 관리</h3>
                          <p className="text-xs text-slate-500">학생 아이디와 이름을 등록하고 관리합니다.</p>
                        </div>
                      </div>
                      <span className="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold">
                        총 {students.filter((s) => manageStudentClassFilter === 'ALL' ? true : (s.className || '1반') === manageStudentClassFilter).length}명
                      </span>
                    </div>

                    <div className="flex flex-wrap items-center gap-1.5">
                      {availableClasses.map((cls) => {
                        const count = cls === 'ALL'
                          ? students.length
                          : students.filter((s) => (s.className || '1반') === cls).length;
                        return (
                          <button
                            key={cls}
                            type="button"
                            onClick={() => {
                              setManageStudentClassFilter(cls);
                              if (cls !== 'ALL') setNewStudentClass(cls);
                            }}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-colors ${
                              manageStudentClassFilter === cls
                                ? 'bg-indigo-600 text-white shadow-2xs'
                                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                            }`}
                          >
                            {cls === 'ALL' ? `전체 반 (${count})` : `${cls} (${count})`}
                          </button>
                        );
                      })}
                    </div>

                    <form onSubmit={handleAddStudent} className="p-4 rounded-xl bg-slate-50 border border-slate-200/80 space-y-3">
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">학생 아이디</label>
                          <input
                            type="text"
                            value={newStudentId}
                            onChange={(e) => setNewStudentId(e.target.value)}
                            placeholder="예: YCES3101"
                            className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">학생 이름 *</label>
                          <input
                            type="text"
                            value={newStudentName}
                            onChange={(e) => setNewStudentName(e.target.value)}
                            placeholder="예: 홍길동"
                            className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">반</label>
                          <input
                            type="text"
                            value={newStudentClass}
                            onChange={(e) => setNewStudentClass(e.target.value)}
                            placeholder="예: 1반"
                            className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          />
                        </div>
                      </div>
                      <button
                        type="submit"
                        className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl transition-colors"
                      >
                        + 학생 추가하기
                      </button>
                    </form>

                    <div className="max-h-96 overflow-y-auto divide-y divide-slate-100 border border-slate-100 rounded-xl">
                      {(() => {
                        const displayedStudents = sortedStudents.filter((s) =>
                          manageStudentClassFilter === 'ALL' ? true : (s.className || '1반') === manageStudentClassFilter
                        );
                        if (displayedStudents.length === 0) {
                          return (
                            <div className="p-8 text-center text-sm text-slate-400">
                              {manageStudentClassFilter === 'ALL'
                                ? '등록된 학생이 없습니다. 위에서 학생을 추가해 주세요.'
                                : `${manageStudentClassFilter}에 등록된 학생이 없습니다.`}
                            </div>
                          );
                        }
                        return displayedStudents.map((st) => (
                          <div
                            key={st.id}
                            draggable
                            onDragStart={() => setDraggedStudentId(st.id)}
                            onDragOver={(e) => e.preventDefault()}
                            onDrop={() => handleDropStudent(st.id)}
                            onDragEnd={() => setDraggedStudentId(null)}
                            className={`px-4 py-3 flex items-center justify-between transition-colors cursor-grab active:cursor-grabbing ${
                              draggedStudentId === st.id ? 'bg-indigo-50/70 opacity-60' : 'hover:bg-slate-50'
                            }`}
                          >
                            <div className="flex items-center gap-2.5">
                              <span className="text-slate-300 hover:text-slate-500 select-none text-sm font-bold" title="드래그하여 순서 변경">
                                ⋮⋮
                              </span>
                              <select
                                value={st.className || '1반'}
                                onChange={(e) => handleChangeStudentClass(st, e.target.value)}
                                title="클릭하여 반 이동"
                                className="px-2 py-1 rounded-md bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-colors"
                              >
                                {availableClasses
                                  .filter((c) => c !== 'ALL')
                                  .map((cls) => (
                                    <option key={cls} value={cls} className="bg-white text-slate-800">
                                      {cls}
                                    </option>
                                  ))}
                              </select>
                              <div>
                                <span className="font-bold text-slate-900 text-sm">{st.name}</span>
                                <span className="ml-2 text-xs text-slate-400 font-mono">{st.id}</span>
                              </div>
                            </div>
                            <div className="flex items-center gap-3">
                              <span className="text-xs font-extrabold text-amber-600">
                                {studentPointsMap[st.id] || 0} P
                              </span>
                              <button
                                type="button"
                                onClick={() => handleDeleteStudent(st)}
                                className="px-2.5 py-1 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50 transition-colors"
                              >
                                삭제
                              </button>
                            </div>
                          </div>
                        ));
                      })()}
                    </div>
                  </section>

                  <section className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-5">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2.5">
                        <div className="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                          <Icon name="calendar" className="w-5 h-5" />
                        </div>
                        <div>
                          <h3 className="text-lg font-bold text-slate-900">요일별 · 날짜별 숙제 관리</h3>
                          <p className="text-xs text-slate-500">반별 반복 요일 숙제나 특정 날짜 과제를 등록합니다.</p>
                        </div>
                      </div>
                      <span className="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold">
                        총 {homeworks.length}개
                      </span>
                    </div>

                    <form onSubmit={handleAddHomework} className="p-4 rounded-xl bg-slate-50 border border-slate-200/80 space-y-3.5">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">대상 반</label>
                          <input
                            type="text"
                            value={newHwClass}
                            onChange={(e) => setNewHwClass(e.target.value)}
                            placeholder="전체 또는 1반"
                            className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">배정 방식</label>
                          <select
                            value={newHwType}
                            onChange={(e) => setNewHwType(e.target.value)}
                            className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          >
                            <option value="weekly">매주 요일 반복</option>
                            <option value="specific">특정 날짜 지정</option>
                          </select>
                        </div>
                      </div>

                      <div className="flex flex-wrap items-center gap-1.5">
                        <span className="text-[11px] font-semibold text-slate-400 mr-1">빠른 반 선택:</span>
                        {['전체', ...availableClasses.filter((c) => c !== 'ALL')].map((cls) => (
                          <button
                            key={cls}
                            type="button"
                            onClick={() => setNewHwClass(cls)}
                            className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-colors ${
                              newHwClass === cls
                                ? 'bg-indigo-600 text-white'
                                : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'
                            }`}
                          >
                            {cls}
                          </button>
                        ))}
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">숙제 내용 *</label>
                        <input
                          type="text"
                          value={newHwTitle}
                          onChange={(e) => setNewHwTitle(e.target.value)}
                          placeholder="예: 수학 익힘책 32~33쪽 풀기"
                          className="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>

                      {newHwType === 'weekly' ? (
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1.5">반복 요일 선택</label>
                          <div className="grid grid-cols-7 gap-1.5">
                            {DAYS_OF_WEEK.map((day) => {
                              const selected = newHwDays.includes(day.id);
                              return (
                                <button
                                  key={day.id}
                                  type="button"
                                  onClick={() =>
                                    setNewHwDays((prev) =>
                                      prev.includes(day.id)
                                        ? prev.filter((d) => d !== day.id)
                                        : [...prev, day.id]
                                    )
                                  }
                                  className={`py-2 rounded-xl text-xs font-bold border transition-all ${
                                    selected
                                      ? 'bg-indigo-600 border-indigo-600 text-white shadow-xs'
                                      : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-100'
                                  }`}
                                >
                                  {day.label}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      ) : (
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">제출 날짜 선택</label>
                          <input
                            type="date"
                            value={newHwSpecificDate}
                            onChange={(e) => setNewHwSpecificDate(e.target.value)}
                            className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          />
                        </div>
                      )}

                      <button
                        type="submit"
                        className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl transition-colors"
                      >
                        + 숙제 등록하기
                      </button>
                    </form>

                    <div className="max-h-96 overflow-y-auto divide-y divide-slate-100 border border-slate-100 rounded-xl">
                      {homeworks.length === 0 ? (
                        <div className="p-8 text-center text-sm text-slate-400">
                          등록된 숙제가 없습니다. 위에서 새 숙제를 등록해 주세요.
                        </div>
                      ) : (
                        homeworks.map((hw) => {
                          const orderedDays = DAYS_OF_WEEK.filter((d) =>
                            Array.isArray(hw.days) && hw.days.includes(d.id)
                          ).map((d) => d.label);

                          return (
                            <div key={hw.id} className="p-4 flex items-center justify-between gap-3 hover:bg-slate-50">
                              <div className="space-y-1">
                                <div className="flex flex-wrap items-center gap-1.5">
                                  <span className="px-2 py-0.5 rounded bg-slate-200/70 text-slate-700 text-[11px] font-bold">
                                    {hw.className || '전체'}
                                  </span>
                                  {hw.type === 'specific' || hw.specificDate ? (
                                    <span className="px-2 py-0.5 rounded bg-amber-50 text-amber-700 text-[11px] font-bold">
                                      {hw.specificDate}
                                    </span>
                                  ) : (
                                    <span className="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 text-[11px] font-bold">
                                      매주 {orderedDays.length > 0 ? orderedDays.join('·') : '요일 미지정'}
                                    </span>
                                  )}
                                </div>
                                <div className="font-bold text-slate-900 text-sm">{hw.title}</div>
                              </div>
                              <button
                                type="button"
                                onClick={() => handleDeleteHomework(hw)}
                                className="px-2.5 py-1 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50 shrink-0 transition-colors"
                              >
                                삭제
                              </button>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </section>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <section className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                    <div className="flex items-center gap-2.5">
                      <div className="w-9 h-9 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                        <Icon name="image" className="w-5 h-5" />
                      </div>
                      <div>
                        <h3 className="text-base font-bold text-slate-900">첫 화면 마스코트 설정</h3>
                        <p className="text-xs text-slate-500">로그인 화면에 표시될 캐릭터 이미지를 변경합니다.</p>
                      </div>
                    </div>

                    <div className="flex items-center gap-4">
                      <div className="w-20 h-20 rounded-full border-2 border-indigo-100 overflow-hidden bg-slate-50 shrink-0">
                        <img
                          src={homeLogoUrl || DEFAULT_TEACHER_LOGO}
                          alt="현재 마스코트"
                          className="w-full h-full object-cover"
                        />
                      </div>
                      <div className="flex flex-wrap gap-2">
                        <label className="cursor-pointer inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition-colors">
                          <Icon name="upload" className="w-4 h-4" /> 새 이미지 업로드
                          <input
                            type="file"
                            accept="image/*"
                            onChange={handleUploadHomeImage}
                            className="hidden"
                          />
                        </label>
                        <button
                          type="button"
                          onClick={handleResetHomeImage}
                          className="px-3.5 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-bold transition-colors"
                        >
                          기본값 복원
                        </button>
                      </div>
                    </div>
                  </section>

                  <section className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                    <div className="flex items-center gap-2.5">
                      <div className="w-9 h-9 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center">
                        <Icon name="shield" className="w-5 h-5" />
                      </div>
                      <div>
                        <h3 className="text-base font-bold text-slate-900">관리자 비밀번호 변경</h3>
                        <p className="text-xs text-slate-500">교사 관리자 로그인 4자리 숫자 비밀번호를 변경합니다.</p>
                      </div>
                    </div>

                    <form onSubmit={handleChangeAdminPin} className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                      <input
                        type="password"
                        maxLength={4}
                        value={oldPinInput}
                        onChange={(e) => setOldPinInput(e.target.value)}
                        placeholder="현재 PIN"
                        className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                      <input
                        type="password"
                        maxLength={4}
                        value={newPinInput}
                        onChange={(e) => setNewPinInput(e.target.value)}
                        placeholder="새 PIN (4자리)"
                        className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                      <div className="flex gap-2">
                        <input
                          type="password"
                          maxLength={4}
                          value={confirmPinInput}
                          onChange={(e) => setConfirmPinInput(e.target.value)}
                          placeholder="새 PIN 확인"
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                        <button
                          type="submit"
                          className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl shrink-0"
                        >
                          변경
                        </button>
                      </div>
                    </form>
                  </section>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    function mountApp() {
      if (window.FirebaseSDK) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App fb={window.FirebaseSDK} />);
      } else {
        window.addEventListener('firebase-ready', () => {
          const root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(<App fb={window.FirebaseSDK} />);
        });
      }
    }

    mountApp();
  </script>
</body>
</html>
